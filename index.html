    // ★ 強化版 fetchWithRetry：遇到 4xx 錯誤不盲目重試，直接拋出以利備援機制接手
    const fetchWithRetry = async (url, options, retries = 2) => {
      const delays = [1000, 2000];
      for (let i = 0; i < retries; i++) {
        try {
          const res = await fetch(url, options);
          if (!res.ok) {
            let errorText = '';
            try { errorText = await res.text(); } catch(e) {}
            const err = new Error(`HTTP ${res.status}: ${errorText}`);
            err.status = res.status;
            throw err;
          }
          return await res.json();
        } catch (err) {
          // 429: Quota/Rate Limit, 404: Not Found, 403: Forbidden, 400: Bad Request
          if (err.status === 400 || err.status === 403 || err.status === 404 || err.status === 429) {
            throw err;
          }
          if (i === retries - 1) throw err;
          await new Promise(resolve => setTimeout(resolve, delays[i]));
        }
      }
    };

    // ★ 自動模型備援機制：將最可靠的 1.5-flash 排第一位，並正確處理 429 額度耗盡的問題
    const generateContentWithFallback = async (payload, apiKey) => {
      const modelsToTry = [
        "gemini-1.5-flash",        // 首選：最穩定、免費額度配置最完整的版本
        "gemini-1.5-flash-latest", 
        "gemini-2.0-flash"         // 2.0 版本在某些地區或免費專案中會回報 Quota Limit 0 (429錯誤)
      ];
      
      let lastError;
      for (const model of modelsToTry) {
        try {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
          const res = await fetchWithRetry(url, { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify(payload) 
          });
          return res;
        } catch (err) {
          console.warn(`[備援機制] 模型 ${model} 測試失敗:`, err.message);
          lastError = err;
          
          // 如果是 404 (模型找不到) 或是 429 (該模型額度耗盡)，就換下一個模型試試看
          // 如果是其他問題 (例如 403 金鑰錯誤)，直接停止並報錯
          if (err.status !== 404 && err.status !== 429) {
            throw err; 
          }
        }
      }
      throw lastError; // 全部失敗，拋出最後一個錯誤
    };

    const getNeonTagStyle = (text) => {
      if (!text) return { backgroundColor: '#f3f4f6', color: '#374151' };
      const neonColors = [
        { bg: '#E0FF00', text: '#000000' }, { bg: '#00F0FF', text: '#000000' },
        { bg: '#FF0055', text: '#FFFFFF' }, { bg: '#00FF66', text: '#000000' },
        { bg: '#FF4F00', text: '#FFFFFF' }, { bg: '#9D00FF', text: '#FFFFFF' },
        { bg: '#FFFF00', text: '#000000' }, { bg: '#FF00FF', text: '#FFFFFF' },
      ];
      let hash = 0;
      for (let i = 0; i < text.length; i++) {
        hash = text.charCodeAt(i) + ((hash << 5) - hash);
      }
      const index = Math.abs(hash) % neonColors.length;
      const color = neonColors[index];
      return { 
        backgroundColor: color.bg, 
        color: color.text,
        border: `1px solid ${color.text === '#000000' ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.2)'}`
      };
    };

        }
        if (!user) {
          showToast(t('toastDbNotReady'));
          return;
        }
        setIsProcessing(true);
        const now = new Date().toISOString();
        
        try {
          const vendorsRef = collection(db, 'public_vendors');

          if (editingId) {
            const existingVendor = vendors.find(v => v.id === editingId);
            const snapshot = { ...existingVendor };
            delete snapshot.history; 
            const newHistory = [{ updatedAt: snapshot.lastUpdated || now, data: snapshot }, ...(existingVendor.history || [])].slice(0, 10);
            const docRef = doc(vendorsRef, editingId);
            await setDoc(docRef, { ...formData, id: editingId, lastUpdated: now, history: newHistory });
          } else {
            const newId = Date.now().toString();
            const docRef = doc(vendorsRef, newId);
            await setDoc(docRef, { ...formData, id: newId, sortIndex: vendors.length, lastUpdated: now, history: [] });
          }
          closeModal();
        } catch (error) {
          console.error("Save error:", error);
          if (editingId) {
             setVendors(vendors.map(v => v.id === editingId ? { ...formData, id: editingId, lastUpdated: now } : v));
          } else {
             setVendors([{ ...formData, id: Date.now().toString(), sortIndex: vendors.length, lastUpdated: now, history: [] }, ...vendors]);
          }
          closeModal();
        } finally {
          setIsProcessing(false);
        }
      };

      const handleEdit = (vendor) => {
        setFormData({ ...initialFormState, ...vendor, catalogs: vendor.catalogs || [] }); 
        setEditingId(vendor.id);
        setFrontImage(null);
        setBackImage(null);
        setIsModalOpen(true);
      };

      const handleDelete = async (id) => {
        if (!isAdmin) {
          showToast(t('toastAdminOnlyDelete'));
          return;
        }
        if (!user) return;
        setDeleteId(id);
      };

      const confirmDelete = async () => {
        if (!user || !deleteId) return;
        try {
          const docRef = doc(db, 'public_vendors', deleteId);
          await deleteDoc(docRef);
          showToast(t('toastDeleted'));
        } catch (error) {
          console.error("Delete error:", error);
          setVendors(vendors.filter(v => v.id !== deleteId));
          showToast(t('toastDeleted'));
        }
        setDeleteId(null);
      };

      const openHistory = (vendor) => {
        if (!isAdmin) {
          showToast(t('toastAdminOnlyHistory'));
          return;
        }
        setHistoryVendor(vendor);
        setSelectedHistoryIndex(0);
      };

      const closeModal = () => {
        setIsModalOpen(false);
        setIsProcessing(false);
        setFrontImage(null);
        setBackImage(null);
        setEditingId(null);
        if (fileInputRef.current) fileInputRef.current.value = '';
        if (cameraInputRef.current) cameraInputRef.current.value = '';
      };

      const parseCSVRow = (str) => {
        let result = [];
        let cur = '';
        let inQuotes = false;
        for (let i = 0; i < str.length; i++) {
            if (str[i] === '"') {
                inQuotes = !inQuotes;
            } else if (str[i] === ',' && !inQuotes) {
                result.push(cur.trim());
                cur = '';
            } else {
                cur += str[i];
            }
        }
        result.push(cur.trim());
        return result.map(s => s.replace(/^"|"$/g, ''));
      };

      const handleImportCSV = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (event) => {
          const buffer = event.target.result;
          const uint8Array = new Uint8Array(buffer);
          
          let text = '';
          try {
            const utf8Decoder = new TextDecoder('utf-8', { fatal: true });
            text = utf8Decoder.decode(uint8Array);
          } catch (err) {
            const sjisDecoder = new TextDecoder('shift-jis');
            text = sjisDecoder.decode(uint8Array);
          }

          const lines = text.split(/\r?\n/);
          if (lines.length < 2) return;

          const newVendors = [];
          const now = new Date().toISOString();

          for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const row = parseCSVRow(lines[i]);
            if (row.length < 2) continue;

            let parsedDataYear = currentYear;
            let parsedCatalogs = [];
            let parsedProjects = [];
            let parsedLastUpdated = now;

            if (row[14] && row[14].trim().startsWith('[')) {
              try {
                const rawCats = JSON.parse(row[14]);
                parsedCatalogs = rawCats.map(c => ({ id: Date.now().toString() + Math.random().toString(36).substring(7), name: c.n || '', url: c.u || '' }));
              } catch(e) {}
            } else {
              parsedDataYear = row[14] || currentYear;
              try {
                if (row[15]) {
                  const rawCats = JSON.parse(row[15]);
                  parsedCatalogs = rawCats.map(c => ({ id: Date.now().toString() + Math.random().toString(36).substring(7), name: c.n || '', url: c.u || '' }));
                }
              } catch(e) {}
              if (row[16]) {
                parsedLastUpdated = row[16];
              }
              if (row[17]) {
                try { parsedProjects = JSON.parse(row[17]); } catch(e) {}
              }
            }

            newVendors.push({
              id: Date.now().toString() + '-' + i,
              category: row[0] || '', company: row[1] || '', hp: row[2] || '',
              department: row[3] || '', name: row[4] || '', furigana: row[5] || '',
              honorific: row[6] || (lang === 'ja' ? '様' : ''), phone: row[7] || '', mobile: row[8] || '',
              email: row[9] || '', postalCode: row[10] || '', address1: row[11] || '',
              address2: row[12] || '', notes: row[13] || '', dataYear: parsedDataYear, 
              catalogs: parsedCatalogs, projects: parsedProjects, lastUpdated: parsedLastUpdated, history: [], sortIndex: i
            });
          }
          
          if (newVendors.length > 0 && user) {
            try {
              const vendorsRef = collection(db, 'public_vendors');
              const chunks = [];
              for (let i = 0; i < newVendors.length; i += 500) {
                chunks.push(newVendors.slice(i, i + 500));
              }
              
              for (const chunk of chunks) {
                const batch = writeBatch(db);
                chunk.forEach(v => {
                  const docRef = doc(vendorsRef, v.id);
                  batch.set(docRef, v);
                });
                await batch.commit();
              }
              showToast(t('toastImportSuccess', newVendors.length));
            } catch (error) {
              console.error("Batch import error:", error);
              setVendors(prev => [...newVendors, ...prev]);
              showToast(`Local import ${newVendors.length} records successful.`);
            }
          }
        };
        reader.readAsArrayBuffer(file);
        e.target.value = ''; 
      };

      const handleExportCSV = () => {
        if (!isAdmin) return;
        
        const headers = [
          t('catCategory'), t('catCompany'), t('catHp'), t('catDept'), t('catName'), t('catFurigana'), 
          t('catHonorific'), t('catPhone'), t('catMobile'), t('catEmail'), t('catPostal'), 
          t('catAddress1'), t('catAddress2'), t('catNotes'), t('catYear'), "Catalogs(JSON)", t('lastUpdated'), "Projects(JSON)"
        ];
        
        const csvContent = [
          headers.join(','),
          ...vendors.map(v => {
            const catalogJson = v.catalogs && v.catalogs.length > 0 
              ? JSON.stringify(v.catalogs.map(c => ({n: c.name, u: c.url}))) 
              : "";
            const projectJson = v.projects && v.projects.length > 0 ? JSON.stringify(v.projects) : "";
            return [
              v.category, v.company, v.hp, v.department, v.name, v.furigana, 
              v.honorific, v.phone, v.mobile, v.email, v.postalCode, 
              v.address1, v.address2, v.notes, v.dataYear, catalogJson, v.lastUpdated || '', projectJson
            ].map(field => `"${(field || '').replace(/"/g, '""')}"`).join(',')
          })
        ].join('\n');

        const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `VendorDB_${new Date().toISOString().slice(0,10)}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const handleVendorDrop = async (e, dropAbsoluteIndex) => {
        e.preventDefault();
        if (sortOrder !== 'manual' || draggedVendorIdx === null || draggedVendorIdx === dropAbsoluteIndex) return;

        const newVendors = [...filteredVendors];
        const draggedItem = newVendors[draggedVendorIdx];
        newVendors.splice(draggedVendorIdx, 1);
        newVendors.splice(dropAbsoluteIndex, 0, draggedItem);

        // 重寫新陣列的 sortIndex
        newVendors.forEach((v, i) => { v.sortIndex = i; });
        setVendors(newVendors); 

        if (!isAdmin) {
            showToast(t('toastLocalSortOnly'));
            return;
        }

        setIsProcessing(true);
        try {
            const vendorsRef = collection(db, 'public_vendors');
            const chunks = [];
            for (let i = 0; i < newVendors.length; i += 500) {
              chunks.push(newVendors.slice(i, i + 500));
            }
            
            for (const chunk of chunks) {
              const batch = writeBatch(db);
              chunk.forEach(v => {
                const docRef = doc(vendorsRef, v.id);
                batch.update(docRef, { sortIndex: v.sortIndex });
              });
              await batch.commit();
            }
            showToast(t('toastSortSaved'));
        } catch(err) {
            console.error("Sort save error:", err);
            showToast(t('toastSaveFail'));
        } finally {
            setIsProcessing(false);
            setDraggedVendorIdx(null);
        }
      };

      const filteredVendors = vendors.filter(v => {
        const matchSearch = !searchTerm || (
          v.name?.includes(searchTerm) || 
          v.company?.includes(searchTerm) || 
          v.department?.includes(searchTerm) ||
          v.dataYear?.includes(searchTerm) ||
          v.category?.includes(searchTerm)
        );
        const matchCat = selectedCategories.length === 0 || selectedCategories.includes(v.category);
        const matchCatalog = !mustHaveCatalog || (v.catalogs && v.catalogs.length > 0);
        const matchProject = !selectedProject || (v.projects && v.projects.includes(selectedProject)); 
        return matchSearch && matchCat && matchCatalog && matchProject;
      }).sort((a, b) => {
        if (sortOrder === 'manual') {
          const idxA = a.sortIndex !== undefined ? a.sortIndex : Number.MAX_SAFE_INTEGER;
          const idxB = b.sortIndex !== undefined ? b.sortIndex : Number.MAX_SAFE_INTEGER;
          if (idxA !== idxB) return idxA - idxB;
        }
        const timeA = new Date(a.lastUpdated || parseInt(a.id.split('-')[0]) || 0).getTime();
        const timeB = new Date(b.lastUpdated || parseInt(b.id.split('-')[0]) || 0).getTime();
        return sortOrder === 'desc' ? timeB - timeA : timeA - timeB;
      });

      const ITEMS_PER_PAGE = 12;
      const [currentPage, setCurrentPage] = useState(1);

      useEffect(() => {
        setCurrentPage(1);
      }, [searchTerm, selectedCategories, mustHaveCatalog, sortOrder, selectedProject]);

      const totalPages = Math.max(1, Math.ceil(filteredVendors.length / ITEMS_PER_PAGE));
      const paginatedVendors = filteredVendors.slice(
        (currentPage - 1) * ITEMS_PER_PAGE, 
        currentPage * ITEMS_PER_PAGE
      );

      const uniqueCategories = [...new Set(vendors.map(v => v.category).filter(c => c && c.trim() !== ''))].sort();
      const uniqueProjects = [...new Set(vendors.flatMap(v => v.projects || []).filter(p => p && p.trim() !== ''))].sort(); 
      const markersRef = useRef([]);

      useEffect(() => {
        if (viewMode !== 'map') return;
        
        const container = document.getElementById('google-map-container');
        if (!container) return;

        const initMap = () => {
          if (!window.google || !window.google.maps) return;
          
          const map = new window.google.maps.Map(container, {
            center: { lat: 35.6895, lng: 139.6917 },
            zoom: 12,
            mapTypeControl: false,
            streetViewControl: false,
          });

          const geocoder = new window.google.maps.Geocoder();
          const bounds = new window.google.maps.LatLngBounds();
          let delay = 0;
          let validPins = 0;

          markersRef.current.forEach(m => m.setMap(null));
          markersRef.current = [];

          filteredVendors.forEach((vendor) => {
            const address = `${vendor.postalCode || ''} ${vendor.address1 || ''} ${vendor.address2 || ''}`.trim();
            if (!address) return;

            setTimeout(() => {
              geocoder.geocode({ address: address }, (results, status) => {
                if (status === 'OK' && results[0]) {
                  const location = results[0].geometry.location;
                  const marker = new window.google.maps.Marker({
                    map: map,
                    position: location,
                    title: vendor.company || vendor.name,
                    animation: window.google.maps.Animation.DROP
                  });

                  const infoWindow = new window.google.maps.InfoWindow({
                    content: `
                      <div style="padding: 4px; max-width: 220px; color: #111827; font-family: sans-serif;">
                        <strong style="font-size: 14px; display: block; margin-bottom: 4px;">${vendor.company || vendor.name || ''}</strong>
                        <div style="font-size: 12px; color: #4B5563; margin-bottom: 8px;">${address}</div>
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}" target="_blank" style="font-size: 12px; color: #2563EB; text-decoration: none; font-weight: bold;">
                          📍 ${t('mapNav')}
                        </a>
                      </div>
                    `
                  });

                  marker.addListener('click', () => {
                    infoWindow.open(map, marker);
                  });

                  markersRef.current.push(marker);
                  bounds.extend(location);
                  validPins++;

                  if (validPins === 1) {
                    map.setCenter(location);
                    map.setZoom(15);
                  } else {
                    map.fitBounds(bounds);
                  }
                }
              });
            }, delay);
            delay += 300;
          });
        };

        if (window.google && window.google.maps) {
          initMap();
        } else if (googleMapsApiKey) {
          const script = document.createElement('script');
          script.src = `https://maps.googleapis.com/maps/api/js?key=${googleMapsApiKey}`;
          script.async = true;
          script.defer = true;
          script.onload = initMap;
          document.head.appendChild(script);
        }
      }, [viewMode, filteredVendors, lang]);

      const renderHistoryDetails = (data) => {
        if (!data) return null;
        return (
          <div className="space-y-4 text-sm">
            <div className="grid grid-cols-2 gap-x-4 gap-y-2 border-b border-gray-200 pb-4">
              <div><span className="text-gray-500 text-xs block">{t('catCompany')}</span><span className="font-medium">{data.company || '-'}</span></div>
              <div><span className="text-gray-500 text-xs block">{t('catCategory')}</span>{data.category || '-'}</div>
              <div><span className="text-gray-500 text-xs block">{t('catYear')}</span>{data.dataYear || '-'}</div>
              <div><span className="text-gray-500 text-xs block">{t('catHp')}</span>{data.hp || '-'}</div>
            </div>
            <div className="grid grid-cols-2 gap-x-4 gap-y-2 border-b border-gray-200 pb-4">
              <div className="col-span-2 sm:col-span-1"><span className="text-gray-500 text-xs block">{t('catDept')}</span>{data.department || '-'}</div>
              <div className="col-span-2 sm:col-span-1"><span className="text-gray-500 text-xs block">{t('catName')}</span>{data.name || '-'} {data.honorific}</div>
              <div className="col-span-2 sm:col-span-1"><span className="text-gray-500 text-xs block">{t('catFurigana')}</span>{data.furigana || '-'}</div>
            </div>
            <div className="grid grid-cols-2 gap-x-4 gap-y-2 border-b border-gray-200 pb-4">
              <div><span className="text-gray-500 text-xs block">{t('catPhone')}</span>{data.phone || '-'}</div>
              <div><span className="text-gray-500 text-xs block">{t('catMobile')}</span>{data.mobile || '-'}</div>
              <div className="col-span-2"><span className="text-gray-500 text-xs block">{t('catEmail')}</span>{data.email || '-'}</div>
            </div>
            <div className="grid grid-cols-1 gap-y-2 border-b border-gray-200 pb-4">
              <div><span className="text-gray-500 text-xs block">{t('catAddress')}</span>
                {data.postalCode && `${data.postalCode} `}{data.address1} {data.address2}
              </div>
              <div><span className="text-gray-500 text-xs block">{t('catNotes')}</span>{data.notes || '-'}</div>
            </div>
          </div>
        );
      };

      const showImagePanel = !editingId && (frontImage || backImage);

      return (
        <div className="min-h-screen bg-[#f7f6f3] text-gray-800 font-sans pb-[env(safe-area-inset-bottom)] flex flex-col">
          
          {showPwaPrompt && (
            <div className="bg-gray-800 text-white px-4 py-3 flex items-center justify-between text-sm shadow-md pt-[env(safe-area-inset-top)] z-50">
              <div className="flex items-center gap-2">
                <Share size={16} />
                <span>{t('pwaPrompt')}</span>
              </div>
              <button onClick={() => setShowPwaPrompt(false)} className="p-1 hover:bg-gray-700 rounded-full transition-colors">
                <X size={16} />
              </button>
            </div>
          )}

          <header className={`bg-white shadow-sm border-b border-gray-200 sticky top-0 z-10 flex-none ${!showPwaPrompt ? 'pt-[env(safe-area-inset-top)]' : ''}`}>
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                
                {/* ★ 更新版精準幾何 S L 排版 Logo (三橫線 + 圓點 + 霓虹綠小人) */}
                <div className="flex items-center cursor-help shrink-0" title="Smartlist">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 750" className="h-10 w-auto sm:h-12 drop-shadow-sm">
                    <g fill="none" stroke="#111827" stroke-width="100" stroke-linecap="butt" stroke-linejoin="miter">
                      <path d="M 100 450 L 345 450 A 75 75 0 0 0 345 300 L 225 300 A 75 75 0 0 1 225 150 L 470 150" />
                      <path d="M 600 100 L 600 375 A 75 75 0 0 0 675 450 L 870 450" />
                    </g>
                    <circle cx="820" cy="600" r="50" fill="#111827" />
                    <g stroke="#111827" stroke-width="20" stroke-linecap="butt">
                      <line x1="100" y1="560" x2="710" y2="560" />
                      <line x1="100" y1="600" x2="710" y2="600" />
                      <line x1="100" y1="640" x2="710" y2="640" />
                    </g>
                    <circle cx="760" cy="180" r="40" fill="#3dfc7a" />
                    <path d="M 660 340 C 660 230, 860 230, 860 340" fill="none" stroke="#3dfc7a" stroke-width="35" stroke-linecap="round" />
                  </svg>
                </div>
                
                <div className="hidden sm:flex items-center gap-2 px-2 py-1 rounded-md bg-gray-50 border border-gray-200 ml-1">
                  {isDbReady ? <Cloud size={14} className="text-gray-700" title={t('connected')} /> : <CloudOff size={14} className="text-gray-400" title={t('offline')} />}
                  <div className="w-px h-3 bg-gray-300 mx-1"></div>
                  <button 
                    onClick={toggleAdmin}
                    className={`flex items-center gap-1.5 px-2 py-0.5 rounded text-xs font-medium transition-colors ${isAdmin ? 'bg-gray-800 text-white' : 'text-gray-500 hover:bg-gray-200'}`}
                    title={t('adminLogin')}
                  >
                    {isAdmin ? <ShieldCheck size={12}/> : <Shield size={12}/>}
                    {isAdmin ? t('admin') : t('user')}
                  </button>
                </div>
                
                <div className="relative ml-1 flex items-center justify-center p-1.5 text-gray-500 hover:text-gray-800 hover:bg-gray-100 rounded-md transition-colors" title="Language">
                  <select
                    value={lang}
                    onChange={(e) => setLang(e.target.value)}
                    className="absolute inset-0 w-full h-full opacity-0 cursor-pointer appearance-none"
                  >
                    <option value="zh">繁中</option>
                    <option value="ja">日本語</option>
                    <option value="en">English</option>
                  </select>
                  <Globe size={18} className="pointer-events-none" />
                </div>

                <button 
                  onClick={() => setShowHelp(true)}
                  className="hidden sm:flex items-center gap-1.5 px-2 py-1.5 text-xs font-bold text-gray-500 hover:text-gray-800 hover:bg-gray-100 rounded-md transition-colors"
                  title={t('help')}
                >
                  <HelpCircle size={16} />
                </button>
              </div>
              
              <div className="flex gap-2 sm:gap-3">
                <button 
                  onClick={() => setShowHelp(true)}
                  className="sm:hidden flex items-center justify-center p-2 text-gray-500 hover:text-gray-800 hover:bg-gray-100 rounded-md transition-colors"
                  title={t('help')}
                >
                  <HelpCircle size={20} />
                </button>

                <input type="file" accept=".csv" className="hidden" ref={csvImportRef} onChange={handleImportCSV} />
                <input type="file" accept="image/*" className="hidden" ref={fileInputRef} onChange={handleFileChange} />
                <input type="file" accept="image/*" capture="environment" className="hidden" ref={cameraInputRef} onChange={handleFileChange} />
                <input type="file" accept="image/*" capture="environment" className="hidden" ref={modalFrontRef} onChange={(e) => handleSideImageChange(e, 'front')} />
                <input type="file" accept="image/*" capture="environment" className="hidden" ref={modalBackRef} onChange={(e) => handleSideImageChange(e, 'back')} />
                
                <button 
                  onClick={() => { if (csvImportRef.current) csvImportRef.current.click(); }}
                  className="flex items-center justify-center p-2 sm:p-2.5 bg-white text-gray-700 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors shadow-sm"
                  title={t('importCSV')}
                >
                  <FileUp size={18} />
                </button>
                {isAdmin && (
                  <button 
                    onClick={handleExportCSV}
                    className="flex items-center justify-center p-2 sm:p-2.5 bg-white text-gray-700 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors shadow-sm"
                    title={t('exportCSV')}
                  >
                    <Download size={18} />
                  </button>
                )}
                <button 
                  onClick={() => { if (fileInputRef.current) fileInputRef.current.click(); }}
                  className="flex items-center justify-center p-2 sm:p-2.5 bg-white border border-gray-200 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors shadow-sm"
                  title={t('uploadCard')}
                >
                  <Upload size={18} />
                </button>
                <button 
                  onClick={() => { if (cameraInputRef.current) cameraInputRef.current.click(); }}
                  className="flex items-center justify-center p-2 sm:p-2.5 bg-gray-800 text-white rounded-lg hover:bg-gray-900 transition-colors shadow-sm"
                  title={t('scanCamera')}
                >
                  <Camera size={18} />
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 flex-1 w-full">
            <div className="mb-6">
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                
                <div className="flex w-full md:w-auto gap-2">
                  <div className="relative w-full md:w-80 shadow-sm rounded-lg flex-grow">
                    <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" size={18} />
                    <input 
                      type="text" 
                      placeholder={t('searchPlaceholder')} 
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="w-full pl-10 pr-4 py-2.5 sm:py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-gray-200 focus:border-gray-400 outline-none transition-shadow text-base sm:text-sm bg-white"
                    />
                  </div>
                  <button
                    onClick={() => setShowAdvFilters(!showAdvFilters)}
                    className={`shrink-0 px-3 py-2 rounded-lg border transition-colors flex items-center justify-center gap-2 shadow-sm ${showAdvFilters ? 'bg-gray-800 text-white border-gray-800' : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50'}`}
                    title={t('advFilters')}
                  >
                    <SlidersHorizontal size={18} />
                    <span className="hidden lg:inline text-sm font-medium">{t('advFilters')}</span>
                    {(selectedCategories.length > 0 || mustHaveCatalog || sortOrder !== 'desc') && (
                      <span className="w-2 h-2 rounded-full bg-[#E0FF00] ml-0.5 border border-black/10"></span>
                    )}
                  </button>
                </div>

                <div className="flex items-center gap-3 w-full md:w-auto justify-end">
                  <div className="bg-gray-100 p-1 rounded-lg flex gap-1 border border-gray-200">
                    <button onClick={() => setViewMode('list')} className={`p-1.5 rounded-md flex items-center justify-center transition-colors ${viewMode === 'list' ? 'bg-white shadow-sm text-gray-800' : 'text-gray-400 hover:text-gray-600'}`} title={t('listView')}>
                      <List size={16} />
                    </button>
                    <button onClick={() => setViewMode('map')} className={`p-1.5 rounded-md flex items-center justify-center transition-colors ${viewMode === 'map' ? 'bg-white shadow-sm text-gray-800' : 'text-gray-400 hover:text-gray-600'}`} title={t('mapView')}>
                      <Map size={16} />
                    </button>
                  </div>
                  <div className="text-sm text-gray-500 font-medium whitespace-nowrap px-1 flex items-center gap-2">
                    {t('totalVendors', filteredVendors.length)}
                    <span className="sm:hidden ml-2 px-2 py-0.5 rounded border border-gray-200 bg-white text-[10px] flex items-center gap-1" onClick={toggleAdmin}>
                       {isAdmin ? <ShieldCheck size={10}/> : <Shield size={10}/>} {isAdmin ? t('admin') : t('user')}
                    </span>
                  </div>
                </div>
              </div>

              {user && (uniqueProjects.length > 0 || selectedProject) && (
                <div className="flex items-center gap-2 overflow-x-auto no-scrollbar pb-3 pt-1 mb-2">
                  <button onClick={() => setSelectedProject('')} className={`shrink-0 px-4 py-2 rounded-full text-sm font-bold transition-all shadow-sm flex items-center gap-2 border ${!selectedProject ? 'bg-gray-800 text-white border-gray-800' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'}`}>
                    <FolderOpen size={16} className={!selectedProject ? 'text-gray-300' : 'text-gray-400'} /> {t('allProjects')}
                  </button>
                  {uniqueProjects.map(p => (
                    <button key={p} onClick={() => setSelectedProject(p)} className={`shrink-0 px-4 py-2 rounded-full text-sm font-bold transition-all shadow-sm flex items-center gap-2 border ${selectedProject === p ? 'bg-blue-600 text-white border-blue-600 ring-2 ring-blue-100 ring-offset-1' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'}`}>
                      <Folder size={16} className={selectedProject === p ? 'text-blue-200' : 'text-blue-500'} /> {p}
                    </button>
                  ))}
                </div>
              )}

              {showAdvFilters && (
                <div className="mt-4 p-4 sm:p-5 bg-white border border-gray-200 rounded-xl shadow-sm animate-in fade-in slide-in-from-top-2">
                  <div className="flex justify-between items-center mb-4 border-b border-gray-100 pb-3">
                    <h3 className="text-sm font-bold text-gray-800 flex items-center gap-2">
                      <Filter size={16} className="text-gray-500"/> {t('advFilters')}
                    </h3>
                    <button 
                      onClick={() => { setSelectedCategories([]); setMustHaveCatalog(false); setSortOrder('desc'); setSearchTerm(''); setSelectedProject(''); }}
                      className="text-xs text-red-500 hover:text-red-700 font-medium transition-colors"
                    >
                      {t('clearFilters')}
                    </button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-12 gap-6">
                    <div className="md:col-span-5 space-y-5">
                      <div>
                        <label className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 block">{t('sortBy')}</label>
                        <div className="flex flex-wrap bg-gray-100 p-1 rounded-lg w-max border border-gray-200">
                          <button onClick={() => setSortOrder('desc')} className={`px-3 py-1.5 text-xs font-medium rounded-md flex items-center gap-1.5 transition-colors ${sortOrder === 'desc' ? 'bg-white shadow text-gray-800' : 'text-gray-500 hover:text-gray-700'}`}>
                            <ArrowDown size={14} /> {t('sortNewest')}
                          </button>
                          <button onClick={() => setSortOrder('asc')} className={`px-3 py-1.5 text-xs font-medium rounded-md flex items-center gap-1.5 transition-colors ${sortOrder === 'asc' ? 'bg-white shadow text-gray-800' : 'text-gray-500 hover:text-gray-700'}`}>
                            <ArrowUp size={14} /> {t('sortOldest')}
                          </button>
                          <button 
                            onClick={() => {
                              if (isFilterActive) { showToast(t('disableSortOnFilter')); return; }
                              setSortOrder('manual');
                            }} 
                            className={`px-3 py-1.5 text-xs font-medium rounded-md flex items-center gap-1.5 transition-colors ${sortOrder === 'manual' ? 'bg-white shadow text-gray-800 ring-2 ring-transparent' : 'text-gray-500 hover:text-gray-700'} ${isFilterActive ? 'opacity-50 cursor-not-allowed' : ''}`}
                            title={isFilterActive ? t('disableSortOnFilter') : ''}
                          >
                            <GripVertical size={14} /> {t('sortManual')}
                          </button>
                        </div>
                      </div>

                      <div>
                        <label className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 block">{t('filterCatalog')}</label>
                        <label className="flex items-center gap-2 cursor-pointer w-max group">
                          <input 
                            type="checkbox" 
                            checked={mustHaveCatalog} 
                            onChange={(e) => setMustHaveCatalog(e.target.checked)}
                            className="w-4 h-4 rounded border-gray-300 text-gray-800 focus:ring-gray-800 cursor-pointer accent-gray-800"
                          />
                          <span className="text-sm font-medium text-gray-700 group-hover:text-black transition-colors flex items-center gap-1.5 select-none">
                            <Book size={14} className="text-gray-400" /> {t('hasCatalog')}
                          </span>
                        </label>
                      </div>
                    </div>

                    <div className="md:col-span-7">
                      <label className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 block">
                        {t('multiCategory')} ({selectedCategories.length}/{uniqueCategories.length})
                      </label>
                      {uniqueCategories.length > 0 ? (
                        <div className="flex flex-wrap gap-2">
                          {uniqueCategories.map(cat => {
                            const isSelected = selectedCategories.includes(cat);
                            const style = isSelected ? getNeonTagStyle(cat) : { backgroundColor: 'white', color: '#6b7280', border: '1px solid #e5e7eb' };
                            return (
                              <button
                                key={cat}
                                onClick={() => setSelectedCategories(prev => prev.includes(cat) ? prev.filter(c => c !== cat) : [...prev, cat])}
                                className={`px-2.5 py-1.5 text-xs font-bold rounded-md flex items-center gap-1.5 shadow-sm transition-all hover:opacity-80 ${isSelected ? 'ring-2 ring-offset-1 ring-gray-200' : ''}`}
                                style={style}
                              >
                                {cat}
                              </button>
                            );
                          })}
                        </div>
                      ) : (
                        <div className="text-sm text-gray-400 italic">No categories available</div>
                      )}
                    </div>
                  </div>
                </div>
              )}
            </div>

            {!user ? (
               <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-8 sm:p-12 text-center flex flex-col items-center mx-2 sm:mx-0">
                 <Loader2 className="animate-spin text-gray-400 mb-4" size={32} />
                 <h3 className="text-lg font-medium text-gray-900 mb-1">{t('connectingDb')}</h3>
               </div>
            ) : filteredVendors.length === 0 ? (
              <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-8 sm:p-12 text-center flex flex-col items-center mx-2 sm:mx-0">
                <div className="bg-gray-100 p-4 rounded-full mb-4">
                  <ImageIcon className="text-gray-400" size={32} />
                </div>
                <h3 className="text-lg font-medium text-gray-900 mb-1">{t('noData')}</h3>
                <p className="text-gray-500 mb-6 max-w-sm text-sm sm:text-base">{t('noDataDesc')}</p>
              </div>
            ) : viewMode === 'map' ? (
              <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-2 h-[600px] sm:h-[75vh] w-full flex flex-col relative overflow-hidden animate-in fade-in duration-300">
                {!googleMapsApiKey && (
                  <div className="absolute inset-0 bg-gray-900/5 z-10 flex flex-col items-center justify-center p-6 text-center backdrop-blur-[2px]">
                    <div className="bg-white p-6 rounded-xl shadow-lg border border-gray-200 max-w-md">
                      <Map size={36} className="mx-auto mb-4 text-gray-400" />
                      <h3 className="text-lg font-bold text-gray-800 mb-2">{t('mapNoKey')}</h3>
                      <p className="text-sm text-gray-500 mb-4">{t('mapKeyHint')}</p>
                    </div>
                  </div>
                )}
                <div id="google-map-container" className="w-full h-full rounded-lg bg-gray-100"></div>
              </div>
            ) : (
              <div className="flex flex-col gap-6 animate-in fade-in duration-300">
                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 sm:gap-5">
                  {paginatedVendors.map((vendor, index) => {
                    const absoluteIndex = (currentPage - 1) * ITEMS_PER_PAGE + index;
                    return (
                    <div 
                      key={vendor.id} 
                      draggable={sortOrder === 'manual'}
                      onDragStart={(e) => {
                        if (sortOrder !== 'manual') return;
                        setDraggedVendorIdx(absoluteIndex);
                        e.dataTransfer.effectAllowed = "move";
                        e.currentTarget.style.opacity = '0.5';
                      }}
                      onDragEnd={(e) => {
                        if (sortOrder !== 'manual') return;
                        e.currentTarget.style.opacity = '1';
                        setDraggedVendorIdx(null);
                      }}
                      onDragOver={(e) => {
                        if (sortOrder !== 'manual') return;
                        e.preventDefault();
                      }}
                      onDrop={(e) => handleVendorDrop(e, absoluteIndex)}
                      className={`bg-white rounded-xl shadow-sm border border-gray-200 hover:shadow-md transition-all flex flex-col group relative ${sortOrder === 'manual' ? 'cursor-grab active:cursor-grabbing ring-2 ring-transparent hover:ring-gray-300' : ''}`}
                    >
                      
                      {/* ★ 手動拖曳模式時顯示把手 */}
                      {sortOrder === 'manual' && (
                         <div className="absolute top-1/2 left-0 -translate-y-1/2 -translate-x-1/2 w-5 h-10 bg-white shadow-md border border-gray-200 rounded flex items-center justify-center text-gray-400 z-20 pointer-events-none">
                           <GripVertical size={14} />
                         </div>
                      )}

                      {/* ★ 新增：右上角快捷按鈕群 (通訊錄與 Email) */}
                      <div className="absolute top-4 right-4 flex items-center gap-2 z-10">
                        {/* 同步至通訊錄按鈕 (vCard) */}
                        {(vendor.phone || vendor.mobile || vendor.name || vendor.company) && (
                          <button 
                            onClick={(e) => handleDownloadVCard(vendor, e)}
                            className="w-8 h-8 bg-green-500 text-white hover:bg-green-600 active:bg-green-700 rounded-full transition-all shadow-md hover:shadow-lg flex items-center justify-center opacity-80 hover:opacity-100 hover:-translate-y-0.5"
                            title={t('addContact')}
                          >
                            <UserPlus size={14} className="ml-0.5" />
                          </button>
                        )}
                        {/* 發送 Email 按鈕 (強制使用 Gmail) */}
                        {vendor.email && (
                          <a 
                            href={`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(vendor.email)}&body=${encodeURIComponent(`${vendor.company ? vendor.company + '\n' : ''}${vendor.department ? vendor.department + '\n' : ''}${vendor.name || ''} ${vendor.honorific || ''}\n\n`)}`}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="w-8 h-8 bg-blue-500 text-white hover:bg-blue-600 active:bg-blue-700 rounded-full transition-all shadow-md hover:shadow-lg flex items-center justify-center opacity-80 hover:opacity-100 hover:-translate-y-0.5"
                            title={t('sendEmail')}
                            onClick={(e) => e.stopPropagation()}
                          >
                            <Send size={14} className="ml-0.5" />
                          </a>
                        )}
                      </div>

                      <div className="p-4 sm:p-5 flex-grow pr-20"> {/* 增加 pr-20 避免檔到兩個按鈕 */}
                        <div className="flex items-center gap-3 mb-3">
                          {vendor.logo ? (
                            <img src={vendor.logo} alt="logo" className="w-10 h-10 rounded-lg object-cover border border-gray-200 shrink-0 bg-white" />
                          ) : (
                            <div className="w-10 h-10 rounded-lg bg-gray-50 flex items-center justify-center border border-gray-200 shrink-0">
                              <Building2 size={18} className="text-gray-400" />
                            </div>
                          )}
                          <h3 className="text-lg font-bold text-gray-900 line-clamp-1" title={vendor.company || t('noCompany')}>
                            {vendor.company || '—'}
                          </h3>
                        </div>

                        <div className="flex flex-wrap items-center gap-2 mb-4">
                          {vendor.dataYear && (
                            <div 
                              className="px-2.5 py-1 text-xs font-bold rounded-md flex items-center gap-1.5 shadow-sm bg-gray-100 text-gray-700 border border-gray-200 pointer-events-none"
                            >
                              <Calendar size={12} className="text-gray-500" /> {vendor.dataYear}
                            </div>
                          )}
                          {vendor.category && (
                            <button 
                              onClick={(e) => {
                                e.stopPropagation();
                                if (!selectedCategories.includes(vendor.category)) {
                                  setSelectedCategories(prev => [...prev, vendor.category]);
                                }
                                setShowAdvFilters(true);
                                window.scrollTo({ top: 0, behavior: 'smooth' });
                              }}
                              className="px-2.5 py-1 text-xs font-bold rounded-md flex items-center gap-1.5 shadow-sm hover:opacity-80 hover:-translate-y-0.5 transition-all cursor-pointer z-10"
                              style={getNeonTagStyle(vendor.category)}
                              title={t('clickToFilter')}
                            >
                              <Tag size={12} /> {vendor.category}
                            </button>
                          )}
                        </div>
                        
                        <div className="bg-[#fafafa] rounded-lg p-3 mb-4 border border-gray-100">
                          <div className="flex flex-wrap items-end gap-2">
                            <span className="font-bold text-gray-800 text-base">{vendor.name || t('noName')}</span>
                            {vendor.honorific && <span className="text-sm text-gray-500">{vendor.honorific}</span>}
                            {vendor.furigana && <span className="text-xs text-gray-400 ml-1">({vendor.furigana})</span>}
                          </div>
                          {vendor.department && <div className="text-sm text-gray-500 mt-1">{vendor.department}</div>}
                        </div>
                        
                        <div className="space-y-2.5 text-sm text-gray-600">
                          {vendor.phone && (
                            <div className="flex items-center gap-2.5">
                              <Phone size={15} className="text-gray-400 shrink-0" />
                              <a href={`tel:${vendor.phone}`} className="truncate hover:text-black hover:underline transition-colors relative z-10">{vendor.phone}</a>
                            </div>
                          )}
                          {vendor.mobile && (
                            <div className="flex items-center gap-2.5">
                              <Smartphone size={15} className="text-gray-400 shrink-0" />
                              <a href={`tel:${vendor.mobile}`} className="truncate font-medium text-gray-700 hover:text-black hover:underline transition-colors relative z-10">{vendor.mobile}</a>
                            </div>
                          )}
                          {vendor.email && (
                            <div className="flex items-center gap-2.5">
                              <Mail size={15} className="text-gray-400 shrink-0" />
                              <a href={`mailto:${vendor.email}?body=${encodeURIComponent(`${vendor.company ? vendor.company + '\n' : ''}${vendor.department ? vendor.department + '\n' : ''}${vendor.name || ''} ${vendor.honorific || ''}\n\n`)}`} className="truncate hover:text-black hover:underline transition-colors relative z-10">{vendor.email}</a>
                            </div>
                          )}
                          {(vendor.address1 || vendor.address2) && (
                            <div className="flex items-start gap-2.5">
                              <MapPin size={15} className="text-gray-400 shrink-0 mt-0.5" />
                              <span className="line-clamp-2">
                                {vendor.postalCode && `${vendor.postalCode} `}
                                {vendor.address1} {vendor.address2}
                              </span>
                            </div>
                          )}
                        </div>

                        {vendor.projects && vendor.projects.length > 0 && (
                          <div className="mt-4 pt-3 border-t border-gray-100 flex flex-wrap gap-1.5">
                            {vendor.projects.map(p => (
                              <button key={p} onClick={(e) => { e.stopPropagation(); setSelectedProject(p); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="px-2 py-0.5 bg-blue-50 text-blue-700 border border-blue-100 rounded text-[10px] font-bold flex items-center gap-1 hover:bg-blue-100 transition-colors z-10 relative">
                                <Folder size={10} /> {p}
                              </button>
                            ))}
                          </div>
                        )}

                        {vendor.catalogs && vendor.catalogs.length > 0 && (
                          <div className="mt-4 pt-4 border-t border-gray-100 space-y-2">
                            <div className="text-xs font-bold text-gray-500 mb-2 flex items-center gap-1.5">
                              <Briefcase size={14} /> {t('catalogs')}
                            </div>
                            {vendor.catalogs.map(cat => (
                              <div key={cat.id} className="flex items-center justify-between bg-[#fafafa] hover:bg-gray-100 p-2 rounded-md border border-gray-100 transition-colors">
                                <a href={cat.url} target="_blank" rel="noreferrer" className="flex items-center gap-1.5 text-gray-700 hover:text-black font-medium transition-colors text-sm truncate flex-grow pr-2 relative z-10" title={cat.url}>
                                  <LinkIcon size={14} className="shrink-0 text-gray-400" />
                                  <span className="truncate">{cat.name || t('untitledCatalog')}</span>
                                 </a>
                                {cat.url && (
                                  <div className="relative group shrink-0 z-10">
                                    <button className="p-1 text-gray-400 hover:text-gray-800 rounded flex items-center justify-center active:bg-gray-200">
                                      <QrCode size={16} />
                                    </button>
                                    <div className="absolute bottom-full right-0 mb-2 hidden group-hover:block active:block z-20">
                                      <div className="bg-white p-3 rounded-xl shadow-lg border border-gray-200 flex flex-col items-center gap-2">
                                        <img 
                                          src={`https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(cat.url)}`} 
                                          alt="QR Code" 
                                          className="w-28 h-28 object-contain shrink-0" 
                                        />
                                        <span className="text-[10px] text-gray-400 whitespace-nowrap font-medium">{t('scanToView')}</span>
                                      </div>
                                    </div>
                                  </div>
                                )}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                      
                      <div className="px-4 py-3 bg-[#fafafa] border-t border-gray-100 flex flex-col sm:flex-row justify-between sm:items-center gap-2 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity rounded-b-xl relative z-10">
                        <div className="flex flex-col">
                          {vendor.notes && (
                            <div className="text-xs text-gray-500 truncate max-w-[200px]" title={vendor.notes}>
                              {t('notesLabel')} {vendor.notes}
                            </div>
                          )}
                          {vendor.lastUpdated && (
                            <div className="text-[10px] text-gray-400 flex items-center gap-1 mt-0.5">
                              <Clock size={10} /> {t('lastUpdated')} {formatDate(vendor.lastUpdated)}
                            </div>
                          )}
                        </div>
                        <div className="flex gap-1.5 shrink-0 self-end sm:self-auto">
                          {isAdmin && vendor.history && vendor.history.length > 0 && (
                            <button onClick={() => openHistory(vendor)} className="p-2 sm:p-1.5 text-gray-400 hover:text-blue-600 hover:bg-blue-50 rounded-md transition-colors" title={t('history')}>
                              <History size={16} />
                            </button>
                          )}
                          <button onClick={() => handleEdit(vendor)} className="p-2 sm:p-1.5 text-gray-500 hover:text-gray-900 hover:bg-gray-200 rounded-md transition-colors active:bg-gray-300" title={t('edit')}>
                            <Edit2 size={16} />
                          </button>
                          {isAdmin && (
                            <button onClick={() => handleDelete(vendor.id)} className="p-2 sm:p-1.5 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-md transition-colors active:bg-red-100" title={t('delete')}>
                              <Trash2 size={16} />
                            </button>
                          )}
                        </div>
                      </div>
                    </div>
                  )})}
                </div>

                {/* 分頁控制項 (Pagination UI) */}
                {totalPages > 1 && (
                  <div className="flex justify-center items-center gap-4 mt-2 mb-4">
                    <button
                      onClick={() => setCurrentPage(p => Math.max(1, p - 1))}
                      disabled={currentPage === 1}
                      className="p-2 rounded-lg border border-gray-200 bg-white text-gray-700 disabled:opacity-30 disabled:cursor-not-allowed hover:bg-gray-50 transition-colors shadow-sm"
                      title="上一頁"
                    >
                      <ChevronLeft size={20} />
                    </button>
                    <span className="text-sm font-bold text-gray-500 bg-gray-100 px-4 py-1.5 rounded-full border border-gray-200">
                      {currentPage} / {totalPages}
                    </span>
                    <button
                      onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))}
                      disabled={currentPage === totalPages}
                      className="p-2 rounded-lg border border-gray-200 bg-white text-gray-700 disabled:opacity-30 disabled:cursor-not-allowed hover:bg-gray-50 transition-colors shadow-sm"
                      title="下一頁"
                    >
                      <ChevronRight size={20} />
                    </button>
                  </div>
                )}
              </div>
            )}
          </main>

          <footer className="w-full py-8 text-center text-sm font-medium text-gray-400 flex-none">
            Developed by Leo Wu
          </footer>

          {/* 歷史紀錄檢視視窗 (History Modal) */}
          {historyVendor && (
            <div className="fixed inset-0 bg-gray-900/60 z-[60] flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-4xl h-[85vh] flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-200">
                <div className="px-5 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                  <h2 className="text-lg font-bold text-gray-900 flex items-center gap-2">
                    <History size={20} className="text-gray-500" />
                    {t('historyTitle')} <span className="text-sm font-normal text-gray-500">({historyVendor.company})</span>
                  </h2>
                  <button onClick={() => setHistoryVendor(null)} className="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-200 rounded-full transition-colors">
                    <X size={20} />
                  </button>
                </div>
                
                <div className="flex-1 flex flex-col sm:flex-row overflow-hidden">
                  <div className="w-full sm:w-1/3 border-b sm:border-b-0 sm:border-r border-gray-200 bg-[#fafafa] overflow-y-auto p-4 flex flex-col gap-2">
                    <h3 className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 px-1">{t('versionList')}</h3>
                    
                    <div 
                      className={`p-3 rounded-lg cursor-pointer border transition-colors ${selectedHistoryIndex === 0 ? 'bg-white border-gray-400 shadow-sm' : 'border-transparent hover:bg-gray-100'}`}
                      onClick={() => setSelectedHistoryIndex(0)}
                    >
                      <div className="text-sm font-bold text-gray-800 flex items-center justify-between">
                        {t('currentData')}
                        <span className="text-[10px] px-1.5 py-0.5 rounded shadow-sm border border-gray-200 bg-gray-100 text-gray-700">Current</span>
                      </div>

                          <div className="space-y-1 sm:col-span-2"><label className="text-xs font-semibold text-gray-600">{t('catEmail')}</label><input type="email" name="email" value={formData.email} onChange={handleInputChange} className="w-full px-3 py-2 sm:py-2 text-base sm:text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-200 focus:border-gray-400 outline-none bg-white" /></div>

                          <div className="space-y-1 sm:col-span-6"><label className="text-xs font-semibold text-gray-600">{t('catAddress2')}</label><input type="text" name="address2" value={formData.address2} onChange={handleInputChange} className="w-full px-3 py-2 sm:py-2 text-base sm:text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-200 focus:border-gray-400 outline-none bg-white" /></div>
                          <div className="space-y-1 sm:col-span-6"><label className="text-xs font-semibold text-gray-600">{t('catNotes')}</label><textarea name="notes" value={formData.notes} onChange={handleInputChange} rows={2} className="w-full px-3 py-2 sm:py-2 text-base sm:text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-200 focus:border-gray-400 outline-none resize-none bg-white" /></div>
                        </div>
                      </div>

                      <div className="mb-6">

                                  <button onClick={() => handleRemoveProject(p)} className="hover:text-red-500 ml-0.5 p-0.5 rounded-full hover:bg-red-50 transition-colors"><X size={12} /></button>
                                </span>
                              ))}

                            <button 
                              onClick={handleAddProject} 
                              className="shrink-0 flex items-center gap-1.5 text-sm font-medium px-4 py-2 rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200 active:bg-gray-300 transition-colors border border-gray-200"

                            </button>
                          </div>

                            <PlusCircle size={14} /> {t('addLink')}
                          </button>
                        </div>
                        
                        <div className="space-y-3">
                          {(!formData.catalogs || formData.catalogs.length === 0) ? (
                            <div className="text-center py-6 text-sm sm:text-xs text-gray-400 bg-[#fafafa] rounded-lg border border-dashed border-gray-300">
                              {t('noCatalogLinks')}
                            </div>
                          ) : (
                            formData.catalogs.map((catalog, index) => (
                              <div 
                                key={catalog.id} 
                                draggable 
                                onDragStart={(e) => { setDraggedCatalogIdx(index); e.currentTarget.style.opacity = '0.4'; }}
                                onDragEnd={(e) => { e.currentTarget.style.opacity = '1'; setDraggedCatalogIdx(null); }}
                                onDragOver={(e) => e.preventDefault()}
                                onDrop={(e) => {
                                  e.preventDefault();
                                  if (draggedCatalogIdx === null || draggedCatalogIdx === index) return;
                                  const newCatalogs = [...formData.catalogs];
                                  const item = newCatalogs[draggedCatalogIdx];
                                  newCatalogs.splice(draggedCatalogIdx, 1);
                                  newCatalogs.splice(index, 0, item);
                                  setFormData(prev => ({ ...prev, catalogs: newCatalogs }));
                                }}
                                className="flex flex-col sm:flex-row gap-3 items-start bg-[#fafafa] p-3 sm:p-3 rounded-lg border border-gray-200 relative group cursor-grab active:cursor-grabbing transition-transform"

                                <div className="hidden sm:flex self-center px-1 text-gray-300 hover:text-gray-500 active:text-gray-700">

                                  </div>
                                  <div className="space-y-1">
                                    <label className="text-xs font-semibold text-gray-600">{t('catalogUrl')}</label>

                                  </div>
                                </div>
                                
                                <div className="flex sm:flex-col items-center justify-between w-full sm:w-auto gap-3 sm:gap-1 pt-1 border-t border-gray-200 sm:border-0 sm:pt-0">

                                      <span className="text-[10px] text-gray-400 font-medium hidden sm:block">{t('qrPreview')}</span>

                                  <button onClick={() => handleRemoveCatalog(catalog.id)} className="shrink-0 p-2 sm:p-1.5 sm:mt-1 text-gray-400 hover:text-red-500 hover:bg-red-50 active:bg-red-100 rounded transition-colors flex items-center justify-center relative z-10">
                                    <Trash2 size={18} className="sm:w-4 sm:h-4" />
                                  </button>
                                </div>
                              </div>
                            ))

                    </button>
                    <button

                        isProcessing ? 'bg-gray-400 cursor-not-allowed text-white' : 'bg-gray-800 hover:bg-gray-900 active:bg-black text-white'
                      }`}
                    >
                      <Save size={16} /> {t('saveData')}
                    </button>
                  </div>
                </div>

              </div>
            </div>

                {adminError && <p className="text-red-500 text-sm mb-4">{adminError}</p>}
                <div className="flex justify-end gap-2 mt-4">
                  <button onClick={() => {setShowAdminLogin(false); setAdminError(''); setAdminPassword(''); setAdminEmail('');}} className="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 font-medium">{t('cancel')}</button>
                  <button onClick={handleAdminLoginSubmit} className="px-4 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-900 font-medium">{t('login')}</button>
                </div>
              </div>
            </div>
          )}

          {/* ★ 操作說明視窗 (Help Modal) */}
          {showHelp && (
            <div className="fixed inset-0 bg-gray-900/60 z-[70] flex items-center justify-center p-4 backdrop-blur-sm animate-in fade-in duration-200">
              <div className="bg-white rounded-xl shadow-xl w-full max-w-lg p-6 max-h-[85vh] overflow-y-auto">
                <div className="flex justify-between items-center mb-5">
                  <h3 className="text-lg font-bold text-gray-900 flex items-center gap-2"><HelpCircle size={20} className="text-blue-500" /> {t('helpTitle')}</h3>
                  <button onClick={() => setShowHelp(false)} className="text-gray-400 hover:text-gray-600 hover:bg-gray-100 p-1.5 rounded-full transition-colors"><X size={20}/></button>
                </div>
                
                <div className="space-y-5 text-sm text-gray-700">
                  <p className="font-medium text-gray-900">{t('helpDesc')}</p>
                  
                  <div className="space-y-3 bg-gray-50 p-4 rounded-xl border border-gray-100">
                    <p className="leading-relaxed">{t('helpAdd')}</p>
                    <p className="leading-relaxed">{t('helpSort')}</p>
                    <p className="leading-relaxed">{t('helpProject')}</p>
                    <p className="leading-relaxed">{t('helpAdmin')}</p>
                  </div>
                  
                  <p className="font-bold text-gray-900 mt-2">{t('helpShortcuts')}</p>
                  
                  <div className="space-y-2 bg-blue-50/50 p-4 rounded-xl border border-blue-100 text-blue-900">
                    <p>{t('helpShortcutEsc')}</p>
                    <p>{t('helpShortcutEnter')}</p>
                  </div>
                </div>
                
                <div className="mt-6 flex justify-end">
                  <button onClick={() => setShowHelp(false)} className="px-6 py-2.5 bg-gray-800 text-white rounded-lg hover:bg-gray-900 font-medium transition-colors">{t('close')}</button>
                </div>
              </div>
            </div>
          )}

          {/* 刪除確認視窗 */}
          {deleteId && (
            <div className="fixed inset-0 bg-gray-900/60 z-[70] flex items-center justify-center p-4 backdrop-blur-sm animate-in fade-in duration-200">
              <div className="bg-white rounded-xl shadow-xl w-full max-w-sm p-6 text-center">
                <div className="w-12 h-12 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                  <Trash2 size={24} />
                </div>
                <h3 className="text-lg font-bold text-gray-900 mb-2">{t('deleteConfirmTitle')}</h3>
                <p className="text-gray-500 text-sm mb-6">{t('deleteConfirmDesc')}</p>
                <div className="flex gap-3">
                  <button onClick={() => setDeleteId(null)} className="flex-1 py-2.5 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 font-medium">{t('cancel')}</button>
                  <button onClick={confirmDelete} className="flex-1 py-2.5 bg-red-600 text-white rounded-lg hover:bg-red-700 font-medium">{t('confirmDelete')}</button>
                </div>
              </div>
            </div>
          )}

          {/* 吐司提示 (Toast) */}
          {toast && (
            <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[80] bg-gray-800 text-white px-4 py-2 rounded-lg shadow-lg flex items-center gap-2 animate-in slide-in-from-bottom-4 fade-in duration-300">
              <CheckCircle2 size={16} className="text-green-400" />
              <span className="text-sm font-medium">{toast}</span>
            </div>
          )}
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
